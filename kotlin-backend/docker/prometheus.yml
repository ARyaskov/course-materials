global:
  scrape_interval: 15s
scrape_configs:
  - job_name: atrium-ide        # приложение из IDE на хосте
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8081"] }]
  - job_name: atrium-ktor       # приложение в Compose (profile app)
    metrics_path: /metrics
    static_configs: [{ targets: ["app-ktor:8081"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
