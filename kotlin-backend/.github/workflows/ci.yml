name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew ktlintCheck detekt --continue

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [domain, application, infrastructure, app-spring, app-ktor]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew :${{ matrix.module }}:test :${{ matrix.module }}:koverXmlReport :${{ matrix.module }}:koverVerify -PwarningsAsErrors=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.module }}
          path: "**/build/test-results/**/*.xml"

  integration:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: migrations are append-only
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-status origin/${{ github.base_ref }} -- '**/db/migration/' | grep -E '^(M|D)'; then
            echo "applied migrations must not change"; exit 1
          fi
      - run: ./gradlew integrationTest
      - name: openapi breaking changes
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:docs/openapi.yaml > /tmp/openapi-base.yaml
          docker run --rm -v /tmp:/base -v "$PWD/docs:/docs" tufin/oasdiff breaking /base/openapi-base.yaml /docs/openapi.yaml --fail-on ERR

  image:
    runs-on: ubuntu-latest
    needs: [test, integration]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile.spring
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ghcr.io/atrium-app/atrium-spring:sha-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke — без конфигурации образ падает с кодом 1, а не зависает
        run: |
          set +e
          timeout 60 docker run --rm -e ATRIUM_ENV=prod ghcr.io/atrium-app/atrium-spring:sha-${{ github.sha }}
          test $? -eq 1
      - uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: ghcr.io/atrium-app/atrium-spring:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
