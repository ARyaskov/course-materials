name: deploy
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile.spring
          push: true
          tags: |
            ghcr.io/atrium-app/atrium-spring:${{ steps.version.outputs.v }}
            ghcr.io/atrium-app/atrium-spring:sha-${{ github.sha }}
          build-args: VERSION=${{ steps.version.outputs.v }}
      # обновление окружения (kubectl set image / Argo CD / compose pull) — вне курса
