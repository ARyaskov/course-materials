# docker/nginx/default.conf
server {
    listen 80;
    server_name _;

    # корень — только public, всё остальное недоступно снаружи
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    client_max_body_size 40m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    # сжатие текстовых ответов
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    # заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # всё, чему нет файла, уходит в index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # статика: длительное кэширование, минуя PHP
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # приватные файлы — только по внутреннему перенаправлению
    location /protected/ {
        internal;
        alias /var/www/html/storage/app/private/;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # обработка PHP
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";          # защита от httpoxy

        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_connect_timeout 5s;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;

        internal;                              # только через try_files
    }

    # любой другой .php — не выполнять
    location ~ \.php$ {
        return 404;
    }

    # скрытые файлы, кроме .well-known
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
