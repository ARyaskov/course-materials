; docker/php/php.prod.ini
memory_limit = 256M
max_execution_time = 30
post_max_size = 40M
upload_max_filesize = 32M

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

expose_php = Off
date.timezone = UTC

realpath_cache_size = 4096K
realpath_cache_ttl = 600
