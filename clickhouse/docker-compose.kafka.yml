# Pulse: брокер сообщений для потоковой загрузки (глава 6).
# Запуск вместе с основным стендом:
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
# Создание темы:
#   docker exec -it pulse-kafka /opt/kafka/bin/kafka-topics.sh \
#     --bootstrap-server localhost:9092 --create --topic pulse.events --partitions 2
#
# Два слушателя: kafka:29092 — для контейнеров в сети Compose (ClickHouse),
# localhost:9092 — для клиентов на хосте (симулятор, консольные утилиты).
services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: pulse-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  clickhouse:
    # ClickHouse из основного файла получает брокер по имени kafka (порт 29092)
    depends_on:
      - kafka
