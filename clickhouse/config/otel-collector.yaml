# Pulse: образец конфигурации OpenTelemetry Collector с экспортёром ClickHouse (глава 15).
# На стенде не запускается (нет реального приложения); используется как отправная точка для подключения сервисов.
# Экспортёр создаёт таблицы otel_logs / otel_traces / otel_metrics_* со своей схемой; для перехода на учебную схему
# ставится точка входа (Null-таблица) с материализованным представлением-преобразователем.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 10000
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    username: app_ingest
    password: ${env:CLICKHOUSE_PASSWORD}
    database: pulse
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    ttl: 336h
    timeout: 10s
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
