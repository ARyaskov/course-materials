spring:
  application:
    name: taskflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# JWT (используется JwtService)
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-32-bytes-minimum-key}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

# Внешний сервис уведомлений (NotificationProperties)
notifications:
  base-url: ${NOTIFICATIONS_BASE_URL:http://localhost:9000}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  max-attempts: 3

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
