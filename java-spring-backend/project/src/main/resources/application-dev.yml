spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    properties:
      hibernate:
        show_sql: true

logging:
  level:
    com.example.taskflow: DEBUG
    org.hibernate.SQL: DEBUG
