services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: taskflow
      JWT_SECRET: please-change-this-in-production-min-32-bytes-secret-key
    ports:
      - "8080:8080"

volumes:
  pgdata:
