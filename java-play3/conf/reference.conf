# Значения по умолчанию прикладных настроек Beacon.
# Файл лежит в classpath (conf/ добавляется в него целиком), поэтому Play сливает его
# раньше application.conf: там остаются только отличия и подстановки из окружения.
# Заодно это полный список настроек приложения с дефолтами — то есть документация.

beacon {
  probe {
    enabled = true
    tick = 5 seconds
    batch-size = 200
    parallelism = 16
    default-timeout = 10 seconds
    jitter = 2 seconds
    failures-to-open-incident = 3
    successes-to-resolve-incident = 2
  }
  notify {
    enabled = true
    max-attempts = 5
    initial-backoff = 2 seconds
    timeout = 5 seconds
  }
  security {
    api-key-cache = 60 seconds
    rate-limit-per-minute = 120
    session-ttl = 8 hours
  }
  status-page {
    history-days = 90
    cache-ttl = 15 seconds
  }
}
