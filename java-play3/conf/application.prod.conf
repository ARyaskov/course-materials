# Прод-конфигурация: подключается через -Dconfig.resource=application.prod.conf
include "application.conf"

play.http.secret.key = ${APPLICATION_SECRET}

play.filters.hosts.allowed = [${BEACON_PUBLIC_HOST}]
play.filters.https.redirectEnabled = true
play.filters.https.strictTransportSecurity = "max-age=31536000; includeSubDomains"

play.http.session.secure = true
play.http.session.sameSite = "lax"
play.http.session.httpOnly = true

play.evolutions.db.default.autoApply = false

db.default.hikaricp.maximumPoolSize = 32

beacon.probe.parallelism = 32
beacon.probe.batch-size = 500
