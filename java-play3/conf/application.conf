# ---------------------------------------------------------------------------
# Beacon — конфигурация приложения (Play 3.0.11)
# Значения, помеченные ${?VAR}, переопределяются переменными окружения.
# ---------------------------------------------------------------------------

play.http.secret.key = "beacon-dev-secret-change-me-0123456789abcdef"
play.http.secret.key = ${?APPLICATION_SECRET}

play.i18n.langs = ["ru", "en"]

# Свои модули DI. Классы `Module` в корневом пакете сознательно не используем:
# разделение по слоям читается лучше.
play.modules.enabled += "modules.RepositoryModule"
play.modules.enabled += "modules.ProbeModule"
play.modules.enabled += "modules.SecurityModule"

# Обработчик ошибок: JSON для /api, HTML для остального.
play.http.errorHandler = "beacon.error.BeaconErrorHandler"

# Порядок фильтров задаём сами (см. filters/BeaconFilters.java),
# поэтому play.filters.enabled не используется.
play.http.filters = "filters.BeaconFilters"

play.filters.hosts.allowed = ["localhost:9000", "127.0.0.1:9000", ".localhost"]
play.filters.hosts.allowed += ${?BEACON_PUBLIC_HOST}

play.filters.headers.contentSecurityPolicy = "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' ws: wss:"

play.filters.cors {
  pathPrefixes = ["/api/v1/status"]
  allowedOrigins = null
  allowedHttpMethods = ["GET", "HEAD", "OPTIONS"]
}

play.filters.gzip {
  contentType.whiteList = ["text/*", "application/json", "application/javascript"]
  contentType.blackList = ["text/event-stream"]
}

# ---------------------------------------------------------------------------
# База данных
# ---------------------------------------------------------------------------
db.default.driver = "org.postgresql.Driver"
db.default.url = "jdbc:postgresql://localhost:5432/beacon"
db.default.url = ${?BEACON_DB_URL}
db.default.username = "beacon"
db.default.username = ${?BEACON_DB_USER}
db.default.password = "beacon"
db.default.password = ${?BEACON_DB_PASSWORD}

db.default.hikaricp.maximumPoolSize = 16
db.default.hikaricp.minimumIdle = 4
db.default.hikaricp.connectionTimeout = 5 seconds
db.default.hikaricp.leakDetectionThreshold = 20 seconds

play.evolutions.db.default.enabled = true
play.evolutions.db.default.autoApply = false
play.evolutions.db.default.autoApply = ${?EVOLUTIONS_AUTO_APPLY}
play.evolutions.db.default.useLocks = true

# ---------------------------------------------------------------------------
# Диспетчеры: блокирующий JDBC и исходящие пробы не должны трогать
# дефолтный пул, на котором Play обслуживает запросы.
# ---------------------------------------------------------------------------
beacon-jdbc-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor.fixed-pool-size = 16
  throughput = 1
}

beacon-probe-dispatcher {
  type = Dispatcher
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-min = 4
    parallelism-factor = 2.0
    parallelism-max = 32
  }
  throughput = 10
}

# ---------------------------------------------------------------------------
# Прикладные настройки Beacon.
# Значения по умолчанию — в conf/reference.conf; здесь только то, что отличается
# от них, и подстановки из окружения. Всё это валидируется при старте
# компонентом beacon.config.BeaconSettings.
# ---------------------------------------------------------------------------
beacon.probe.enabled = ${?BEACON_PROBE_ENABLED}
beacon.probe.parallelism = ${?BEACON_PROBE_PARALLELISM}
beacon.security.rate-limit-per-minute = ${?BEACON_RATE_LIMIT}

# ---------------------------------------------------------------------------
# HTTP-сервер (Pekko HTTP — бэкенд Play 3 по умолчанию)
# ---------------------------------------------------------------------------
play.server {
  # Общие настройки сервера (не зависят от бэкенда)
  http.idleTimeout = 75 seconds
  max-header-size = 16k
  terminationTimeout = 15 seconds

  # Настройки бэкенда Pekko HTTP
  pekko {
    bindTimeout = 5 seconds
    requestTimeout = 30 seconds
  }
}

play.ws {
  timeout.connection = 5 seconds
  timeout.idle = 15 seconds
  timeout.request = 20 seconds
  followRedirects = true
  useragent = "Beacon/1.0 (+https://beacon.example)"
  ahc {
    maxConnectionsPerHost = 32
    maxConnectionsTotal = 256
    maxRequestRetry = 0
  }
}

play.cache.bindCaches = ["status-cache", "api-key-cache"]
