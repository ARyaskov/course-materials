micronaut.application.name=meterway

# --- HTTP ---
micronaut.server.port=${SERVER_PORT:8080}
micronaut.server.max-request-size=10MB
micronaut.server.netty.max-header-size=16KB
micronaut.server.thread-selection=AUTO
micronaut.http.client.read-timeout=10s
micronaut.http.client.connect-timeout=3s

# --- Сериализация ---
micronaut.serde.write-binary-as-array=false

# --- Хранилища ---
# Объявлены только тип, диалект и драйвер. Адресов и учётных данных здесь нет:
# при обычном запуске и в тестах их подставляет Micronaut Test Resources, поднимая контейнеры;
# в окружении dev — application-dev.properties с адресами docker compose;
# в проде — переменные окружения и application-k8s.properties.
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.maximum-pool-size=${DB_POOL_SIZE:20}
datasources.default.minimum-idle=2
datasources.default.connection-timeout=3000
datasources.default.pool-name=meterway-pool

redis.timeout=2s

flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/migration
flyway.datasources.default.baseline-on-migrate=true

kafka.health.enabled=true
kafka.consumers.default.session.timeout.ms=30000
kafka.consumers.default.auto.offset.reset=earliest

# --- Кэши ---
micronaut.caches.customers.maximum-size=50000
micronaut.caches.customers.expire-after-write=5m
micronaut.caches.api-keys.maximum-size=5000
micronaut.caches.api-keys.expire-after-write=30s
micronaut.caches.quota-policies.maximum-size=20000
micronaut.caches.quota-policies.expire-after-write=1m
micronaut.caches.price-components.maximum-size=5000
micronaut.caches.price-components.expire-after-write=10m

# --- Безопасность ---
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET:`change-me-in-production-please-use-32-bytes-minimum`}
micronaut.security.token.jwt.generator.access-token.expiration=3600
micronaut.security.token.generator.refresh-token.secret=${REFRESH_SECRET:`change-me-too-and-keep-it-out-of-git`}
micronaut.security.intercept-url-map[0].pattern=/health
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/swagger/**
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[2].access[0]=isAnonymous()

# --- Наблюдаемость ---
endpoints.all.port=${MANAGEMENT_PORT:8081}
endpoints.health.enabled=true
endpoints.health.details-visible=AUTHENTICATED
endpoints.health.disk-space.threshold=100MB
endpoints.prometheus.enabled=true
endpoints.prometheus.sensitive=false
endpoints.metrics.enabled=true
endpoints.info.enabled=true
endpoints.loggers.enabled=true

micronaut.metrics.enabled=true
micronaut.metrics.binders.jvm.enabled=true
micronaut.metrics.binders.web.enabled=true
micronaut.metrics.binders.jdbc.enabled=true
micronaut.metrics.export.prometheus.enabled=true
micronaut.metrics.export.prometheus.step=PT30S
micronaut.metrics.export.prometheus.descriptions=true

otel.exporter.otlp.endpoint=${OTLP_ENDPOINT:`http://localhost:4317`}
otel.traces.exporter=${OTEL_TRACES_EXPORTER:none}
otel.service.name=meterway
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=${OTEL_SAMPLE_RATIO:0.1}

# --- OpenAPI ---
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**

# --- Meterway ---
meterway.ingest.max-batch-size=500
meterway.ingest.idempotency-window=48h
meterway.ingest.late-event-tolerance=72h
meterway.ingest.publish-to-kafka=${PUBLISH_TO_KAFKA:true}
meterway.ingest.ingest-concurrency=16
meterway.ingest.max-stream-events=1000000
meterway.ingest.stream-idle-timeout=60s

meterway.quota.enabled=true
meterway.quota.key-prefix=meterway:quota
meterway.quota.fail-open=true

meterway.billing.default-currency=EUR
meterway.billing.closing-grace-period=6h
meterway.billing.closing-lock-ttl=10m
meterway.billing.close-cron=0 15 * * * *

meterway.webhooks.enabled=true
meterway.webhooks.max-attempts=5
meterway.webhooks.initial-backoff=10s
meterway.webhooks.backoff-multiplier=2.0
meterway.webhooks.max-backoff=1h

meterway.partitions.auto-create=true
meterway.outbox.enabled=true
meterway.outbox.poll-interval=5s

# --- Каталог метрик ---
# Имя секции — один сегмент без точек; настоящий код метрики задаётся свойством code.

meterway.meters.api-requests.code=api.requests
meterway.meters.api-requests.aggregation=SUM
meterway.meters.api-requests.unit=REQUEST
meterway.meters.api-requests.quota-enforced=true
meterway.meters.api-requests.description=Запросы к API

meterway.meters.egress-gb.code=egress.gb
meterway.meters.egress-gb.aggregation=SUM
meterway.meters.egress-gb.unit=GIGABYTE
meterway.meters.egress-gb.quota-enforced=true
meterway.meters.egress-gb.description=Исходящий трафик

meterway.meters.storage-gb-hours.code=storage.gb_hours
meterway.meters.storage-gb-hours.aggregation=SUM
meterway.meters.storage-gb-hours.unit=GIGABYTE_HOUR
meterway.meters.storage-gb-hours.description=Хранение данных

meterway.meters.compute-seconds.code=compute.seconds
meterway.meters.compute-seconds.aggregation=SUM
meterway.meters.compute-seconds.unit=SECOND
meterway.meters.compute-seconds.description=Вычислительное время

meterway.meters.seats-active.code=seats.active
meterway.meters.seats-active.aggregation=UNIQUE_COUNT
meterway.meters.seats-active.unit=UNIT
meterway.meters.seats-active.unique-by=user_id
meterway.meters.seats-active.description=Активные пользователи

meterway.meters.connections-peak.code=connections.peak
meterway.meters.connections-peak.aggregation=MAX
meterway.meters.connections-peak.unit=UNIT
meterway.meters.connections-peak.description=Пиковое число подключений

# --- Лимиты частоты обращений ---
meterway.rate-limits.reports.limit=100
meterway.rate-limits.reports.window=1m
meterway.rate-limits.billing.limit=10
meterway.rate-limits.billing.window=1m
