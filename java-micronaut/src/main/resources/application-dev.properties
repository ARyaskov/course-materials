# Профиль разработки: подробные эндпоинты, открытая диагностика, ускоренные расписания.

endpoints.all.enabled=true
endpoints.all.sensitive=false
endpoints.health.details-visible=ANONYMOUS
endpoints.loggers.write-sensitive=false

flyway.datasources.default.locations=classpath:db/migration,classpath:db/dev
# Демонстрационные данные имеют версию 900, то есть выше любой будущей миграции схемы.
# Новая миграция (например, V8) оказывается «из прошлого» относительно уже применённой V900,
# и валидация Flyway её отвергает. В dev это лечится разрешением применять миграции
# не по порядку; в продакшене профиля db/dev нет, и вопрос не возникает.
flyway.datasources.default.out-of-order=true

logger.levels.io.meterway=DEBUG
logger.levels.io.micronaut.data.query=TRACE

meterway.billing.closing-grace-period=0s
meterway.billing.close-cron=0 */5 * * * *
meterway.outbox.poll-interval=2s
meterway.webhooks.poll-interval=3s

otel.traces.exporter=none

# Учётные записи панели для локальной разработки.
# password-hash — SHA-256 от пароля "meterway".
meterway.console.users.admin.password-hash=9b435628f5c8aebbb5504e5e5fd84ceddb42a924d3e0496fe150e705cecd610c
meterway.console.users.admin.tenant-id=00000000-0000-0000-0000-00000000aa01
meterway.console.users.admin.roles[0]=CONSOLE
meterway.console.users.admin.roles[1]=ADMIN

# --- Инфраструктура локального стенда (docker compose up -d) ---
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.url=jdbc:postgresql://localhost:5432/meterway
datasources.default.username=meterway
datasources.default.password=meterway
datasources.default.maximum-pool-size=10
datasources.default.minimum-idle=2
datasources.default.pool-name=meterway-pool

redis.uri=redis://localhost:6379
redis.timeout=2s

kafka.bootstrap.servers=localhost:9092
