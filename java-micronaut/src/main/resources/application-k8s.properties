# Продовое окружение: все адреса и секреты приходят снаружи.
# Переменные DATASOURCES_DEFAULT_URL, DATASOURCES_DEFAULT_USERNAME, DATASOURCES_DEFAULT_PASSWORD,
# REDIS_URI и KAFKA_BOOTSTRAP_SERVERS перекрывают значения ниже.

redis.io-thread-pool-size=4
redis.computation-thread-pool-size=4

micronaut.config.import=optional:configtree:/etc/meterway/secrets

endpoints.health.details-visible=AUTHENTICATED
endpoints.env.enabled=false
endpoints.beans.enabled=false

otel.traces.exporter=otlp
