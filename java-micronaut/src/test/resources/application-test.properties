# Адреса PostgreSQL и Redis не заданы намеренно: их подставляет Micronaut Test Resources.
# Тип и диалект объявлены в application.properties — по ним провайдер понимает, какой контейнер поднимать.
# Случайный порт: базовая конфигурация фиксирует 8080, и тесты не должны конфликтовать
# ни с запущенным локально приложением, ни между собой при параллельном прогоне.
micronaut.server.port=-1

datasources.default.maximum-pool-size=4

test-resources.containers.postgres.image-name=postgres:18-alpine
test-resources.containers.redis.image-name=redis:8-alpine

flyway.datasources.default.locations=classpath:db/migration

# Всё, что живёт своей жизнью, в тестах выключено: иначе фоновая задача
# начнёт менять те же данные, которые проверяет тест.
meterway.ingest.publish-to-kafka=false
meterway.aggregation.enabled=false
meterway.outbox.enabled=false
meterway.webhooks.enabled=false
meterway.partitions.auto-create=false
meterway.billing.scheduler.enabled=false

otel.traces.exporter=none
endpoints.all.port=-1
