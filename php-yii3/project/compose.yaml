name: helpdesk

x-app: &app-base
  image: helpdesk-api:${APP_VERSION:-dev}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-dev}
  environment:
    APP_VERSION: ${APP_VERSION:-dev}
    YII_ENV: prod
    YII_DEBUG: "0"
    DB_DSN: "pgsql:host=db;port=5432;dbname=${POSTGRES_DB}"
    DB_USER: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_URI: "redis://redis:6379/0"
    APP_SECRET: ${APP_SECRET}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  volumes:
    - runtime:/app/runtime
    - storage:/app/storage
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # одноразовый: отрабатывает и выходит, остальные ждут его успеха
  migrate:
    <<: *app-base
    command: ["php", "yii", "migrate:up", "--interactive=0"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  app:
    <<: *app-base
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "php yii app:health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      update_config:
        order: start-first        # новый контейнер стартует до остановки старого
        parallelism: 1
      resources:
        limits: { memory: 1g, cpus: "2.0" }

  queue-default:
    <<: *app-base
    command: ["php", "yii", "queue:listen", "--channel=default", "--timeout=3"]
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 3

  queue-reports:
    <<: *app-base
    command: ["php", "yii", "queue:listen", "--channel=reports", "--timeout=5"]
    stop_grace_period: 120s
    deploy: { replicas: 1 }

  scheduler:
    <<: *app-base
    command: ["php", "yii", "schedule:run"]
    deploy: { replicas: 1 }        # две реплики запустят задачи дважды

  nginx:
    image: nginx:1.29-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=120        # 2×20 воркеров app + 4 queue + запас
      - -c
      - shared_buffers=512MB
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      # для очереди обязательно: allkeys-lru удалит невыполненные задачи
      - --maxmemory-policy
      - noeviction
      - --maxmemory
      - 512mb
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  runtime:
  storage:
