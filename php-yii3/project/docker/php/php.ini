memory_limit = 256M
expose_php = off
date.timezone = UTC

; ошибки — только в stderr: предупреждение не должно печататься перед JSON
display_errors = off
display_startup_errors = off
html_errors = off
log_errors = on
error_log = /proc/self/fd/2
error_reporting = E_ALL

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; код в образе неизменен — проверять даты файлов незачем
opcache.validate_timestamps = 0
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; загрузка вложений: post_max_size согласован с client_max_body_size в nginx
upload_max_filesize = 10M
post_max_size = 55M
max_file_uploads = 5
