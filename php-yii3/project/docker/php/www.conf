[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; переменные окружения не наследуются воркерами по умолчанию,
; и без этого params.php не увидит ни DB_DSN, ни APP_SECRET
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2

slowlog = /app/runtime/logs/fpm-slow.log
request_slowlog_timeout = 3s
