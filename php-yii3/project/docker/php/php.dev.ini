memory_limit = 512M
display_errors = on
error_reporting = E_ALL
error_log = /proc/self/fd/2

; ВАЖНО для разработки: изменения в коде подхватываются без перезапуска
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

upload_max_filesize = 10M
post_max_size = 55M
date.timezone = UTC
