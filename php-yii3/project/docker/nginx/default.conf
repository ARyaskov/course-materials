server {
    listen 80;
    server_name _;

    # document root — только public/, не корень проекта
    root /app/public;
    index index.php;

    client_max_body_size 55m;      # то же значение, что и post_max_size в php.ini
    client_body_timeout 60s;
    # большие тела пишутся во временный файл, а не в память nginx
    client_body_buffer_size 128k;

    # статика отдаётся nginx-ом, PHP не участвует
    location ~* \.(?:css|js|png|jpe?g|gif|svg|woff2?|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # любой путь, которого нет на диске, уходит в index.php:
    # маршрутизацию делает yiisoft/router, а не nginx
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # выполняем только index.php и ничего больше
    location = /index.php {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # приложение узнаёт исходную схему только отсюда
        fastcgi_param HTTPS           $http_x_forwarded_proto;
        fastcgi_param REQUEST_SCHEME  $http_x_forwarded_proto;

        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_hide_header X-Powered-By;
    }

    # всё, что не index.php и не статика, до PHP не доходит
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
