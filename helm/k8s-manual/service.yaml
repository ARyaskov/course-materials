apiVersion: v1
kind: Service
metadata:
  name: tessera-api
  labels:
    app.kubernetes.io/name: tessera
    app.kubernetes.io/instance: tessera
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tessera
    app.kubernetes.io/instance: tessera
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: admin
      protocol: TCP
