apiVersion: v1
kind: ConfigMap
metadata:
  name: tessera-config
  labels:
    app.kubernetes.io/name: tessera
    app.kubernetes.io/instance: tessera
data:
  TESSERA_ENV: dev
  TESSERA_LOG_LEVEL: debug
  TESSERA_HTTP_ADDR: ":8080"
  TESSERA_ADMIN_ADDR: ":9090"
  TESSERA_REDIS_ADDR: redis:6379
  TESSERA_REDIS_DB: "0"
  TESSERA_DATABASE_MAX_CONN: "10"
  TESSERA_HOLD_TTL: 10m
  TESSERA_SHUTDOWN_DELAY: 5s
  TESSERA_SHUTDOWN_GRACE: 20s
  TESSERA_RATE_LIMITS_FILE: /etc/tessera/rate-limits.yaml
  rate-limits.yaml: |
    endpoints:
      - path: /api/v1/events
        rps: 200
        burst: 400
      - path: /api/v1/orders
        rps: 50
        burst: 100
      - path: /api/v1/checkins
        rps: 500
        burst: 1000
    default:
      rps: 100
      burst: 200
