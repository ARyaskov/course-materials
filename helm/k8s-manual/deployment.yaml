apiVersion: apps/v1
kind: Deployment
metadata:
  name: tessera-api
  labels:
    app.kubernetes.io/name: tessera
    app.kubernetes.io/instance: tessera
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: tessera
      app.kubernetes.io/instance: tessera
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tessera
        app.kubernetes.io/instance: tessera
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: tessera:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: TESSERA_ENV
              value: dev
            - name: TESSERA_LOG_LEVEL
              value: debug
            - name: TESSERA_DATABASE_DSN
              value: postgres://tessera:tessera@postgres:5432/tessera?sslmode=disable
            - name: TESSERA_REDIS_ADDR
              value: redis:6379
            - name: TESSERA_TICKET_SIGN_KEY
              value: dev-only-key
            - name: TESSERA_SHUTDOWN_DELAY
              value: 5s
            - name: TESSERA_SHUTDOWN_GRACE
              value: 20s
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
