{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tessera.fullname" . }}-default-deny
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tessera.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tessera.fullname" . }}-allow-ingress
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tessera.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressControllerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.http }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tessera.fullname" . }}-allow-metrics
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tessera.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.monitoringNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.admin }}
{{- end }}
