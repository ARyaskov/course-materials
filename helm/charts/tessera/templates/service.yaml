apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessera.fullname" . }}-api
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP | quote }}
  {{- end }}
  selector:
    {{- include "tessera.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.service.exposeMetrics }}
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: admin
      protocol: TCP
    {{- end }}
    {{- with .Values.service.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.worker.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessera.fullname" . }}-worker-metrics
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  selector:
    {{- include "tessera.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: admin
      protocol: TCP
{{- end }}
