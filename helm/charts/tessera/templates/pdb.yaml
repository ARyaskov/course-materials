{{- if .Values.podDisruptionBudget.enabled }}
{{- if and (le (int .Values.api.replicaCount) 1) (not .Values.autoscaling.enabled) }}
{{- fail "podDisruptionBudget при одной реплике заблокирует обслуживание узлов" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tessera.fullname" . }}-api
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tessera.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
