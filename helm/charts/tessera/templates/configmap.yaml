apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tessera.fullname" . }}-config
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
data:
  TESSERA_ENV: {{ .Values.config.env | quote }}
  TESSERA_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TESSERA_REDIS_ADDR: {{ .Values.config.redisAddr | quote }}
  TESSERA_REDIS_DB: {{ .Values.config.redisDB | quote }}
  TESSERA_DATABASE_MAX_CONN: {{ .Values.config.databaseMaxConn | quote }}
  TESSERA_HOLD_TTL: {{ .Values.config.holdTTL | quote }}
  TESSERA_SHUTDOWN_DELAY: {{ .Values.config.shutdownDelay | quote }}
  TESSERA_SHUTDOWN_GRACE: {{ .Values.config.shutdownGrace | quote }}
  TESSERA_RATE_LIMITS_FILE: /etc/tessera/rate-limits.yaml
  {{- if .Values.ingress.enabled }}
  TESSERA_PUBLIC_URL: {{ printf "https://%s" (include "tessera.publicHost" .) | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  rate-limits.yaml: |
{{ .Values.config.rateLimits | default (.Files.Get "files/rate-limits.yaml") | indent 4 }}
