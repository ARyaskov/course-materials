{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tessera.fullname" . }}-secrets
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
type: Opaque
stringData:
  TESSERA_DATABASE_DSN: {{ required "secrets.databaseDSN обязателен, если не задан secrets.existingSecret" .Values.secrets.databaseDSN | quote }}
  TESSERA_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  TESSERA_TICKET_SIGN_KEY: {{ required "secrets.ticketSignKey обязателен, если не задан secrets.existingSecret" .Values.secrets.ticketSignKey | quote }}
{{- end }}
