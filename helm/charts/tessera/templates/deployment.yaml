{{- range $component, $cfg := dict "api" .Values.api "worker" .Values.worker }}
{{- if $cfg.enabled }}
{{- $root := $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tessera.fullname" $root }}-{{ $component }}
  labels:
    {{- include "tessera.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (and (eq $component "api") $root.Values.autoscaling.enabled) }}
  replicas: {{ $cfg.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ $root.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "tessera.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  strategy:
    {{- toYaml $cfg.strategy | nindent 4 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- if and $root.Values.secrets.create (not $root.Values.secrets.existingSecret) }}
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
        {{- end }}
        {{- with (default $root.Values.defaults.podAnnotations $cfg.podAnnotations) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tessera.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with (default $root.Values.defaults.podLabels $cfg.podLabels) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tessera.serviceAccountName" $root }}
      automountServiceAccountToken: {{ $root.Values.serviceAccount.automountServiceAccountToken }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds | default $root.Values.defaults.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $component }}
          image: {{ include "tessera.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if eq $component "worker" }}
          command: ["/app/worker"]
          {{- end }}
          ports:
            {{- if eq $component "api" }}
            - name: http
              containerPort: {{ $root.Values.ports.http }}
            {{- end }}
            - name: admin
              containerPort: {{ $root.Values.ports.admin }}
          envFrom:
            - configMapRef:
                name: {{ include "tessera.fullname" $root }}-config
            - secretRef:
                name: {{ include "tessera.secretName" $root }}
          env:
            - name: TESSERA_ADMIN_ADDR
              value: ":{{ $root.Values.ports.admin }}"
            {{- if eq $component "api" }}
            - name: TESSERA_HTTP_ADDR
              value: ":{{ $root.Values.ports.http }}"
            {{- end }}
            {{- with (default $root.Values.defaults.extraEnv $cfg.extraEnv) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $cfg.probes }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/tessera
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "tessera.fullname" $root }}-config
            items:
              - key: rate-limits.yaml
                path: rate-limits.yaml
        - name: tmp
          emptyDir: {}
      {{- with (default $root.Values.defaults.nodeSelector $cfg.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $root.Values.defaults.tolerations $cfg.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $root.Values.defaults.affinity $cfg.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
