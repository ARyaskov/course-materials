suite: secret
templates:
  - secret.yaml
tests:
  - it: не создаётся при заданном existingSecret
    set:
      secrets.existingSecret: tessera-prod-secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: без обязательных значений рендеринг падает с понятным сообщением
    set:
      secrets.create: true
      secrets.existingSecret: ""
      secrets.databaseDSN: ""
    asserts:
      - failedTemplate:
          errorMessage: "secrets.databaseDSN обязателен, если не задан secrets.existingSecret"
