# Временное окружение под ветку. Хост подставляется пайплайном через --set.
api:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 192Mi

worker:
  enabled: false

config:
  env: preview
  logLevel: debug
  holdTTL: 2m

secrets:
  create: false
  existingSecret: tessera-preview-secrets

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: placeholder.preview.tessera.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
