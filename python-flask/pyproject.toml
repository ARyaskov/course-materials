[project]
name = "depot"
version = "0.1.0"
description = "API сети пунктов проката профессионального оборудования"
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1,<4",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "redis>=5.2",
    "rq>=2.0",
    "httpx>=0.27",
    "boto3>=1.35",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
depot-admin = "depot.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "T10", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"migrations/*" = ["ARG", "E402"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -ra"
markers = [
    "slow: требует базы или внешних сервисов",
    "e2e: сквозной сценарий",
]
filterwarnings = ["error"]
