# Обратный прокси перед приложением.
#
# Он берёт на себя то, что сервер приложений делает плохо: TLS, отдачу
# статики, ограничение размера тела, защиту от медленных клиентов.
# Gunicorn с потоками уязвим к соединению, которое отправляет запрос
# по байту в секунду; прокси буферизует такой запрос целиком.

upstream depot_api {
    server 127.0.0.1:8000 fail_timeout=5s max_fails=3;
    keepalive 32;
}

# Ограничение частоты по адресу клиента. Зона общая для всех рабочих
# процессов nginx: счётчик в памяти одного процесса ничего не ограничивает.
limit_req_zone $binary_remote_addr zone=depot_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=depot_auth:10m rate=1r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name api.depot.example;

    ssl_certificate     /etc/letsencrypt/live/api.depot.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.depot.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Предел на тело запроса. Он должен быть согласован с MAX_CONTENT_LENGTH
    # приложения: меньшее значение здесь означает 413 от прокси без
    # понятного клиенту тела ответа.
    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Версия сервера в заголовке — бесплатная подсказка для сканера
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/v1/auth/ {
        # Вход ограничивается строже остального API: это точка перебора
        limit_req zone=depot_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://depot_api;
        include /etc/nginx/proxy_params_depot;
    }

    location /api/ {
        limit_req zone=depot_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://depot_api;
        include /etc/nginx/proxy_params_depot;
    }

    location = /healthz {
        # Проверки не должны попадать в общий журнал доступа: они
        # составили бы большую его часть
        access_log off;
        proxy_pass http://depot_api;
        include /etc/nginx/proxy_params_depot;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://depot_api;
        include /etc/nginx/proxy_params_depot;
    }
}

server {
    listen 80;
    server_name api.depot.example;
    return 301 https://$host$request_uri;
}

# Содержимое /etc/nginx/proxy_params_depot:
#
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
