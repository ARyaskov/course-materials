# Настройки, которые не являются секретами.
#
# Разделение простое: сюда попадает то, что одинаково у всех и меняется
# редко, — величины правил и пределы. Строки подключения, ключи и пароли
# сюда не попадают: файл лежит в репозитории, а секреты приходят
# переменными окружения.
#
# Читается через tomllib из стандартной библиотеки. Файл открывается
# только в двоичном режиме: разбор кодировки — забота самого tomllib.
#
#   import tomllib
#   with open("depot.toml", "rb") as f:
#       settings = tomllib.load(f)

[rules]
# Время на осмотр, чистку и зарядку между арендами одного экземпляра.
# Из-за него стык впритык считается конфликтом.
inspection_buffer_hours = 2

# Сколько экземпляр удерживается за неподтверждённой бронью
hold_duration_minutes = 60

# Предельная длительность одной аренды
max_booking_days = 30

# Доля суточной ставки за каждый начатый час просрочки: 1/12
late_fee_hours_per_day = 12

# Доля залога, выше которой повреждение считается серьёзным и экземпляр
# уходит в ремонт вместо возврата в оборот
severe_damage_ratio = 0.3

[limits]
# Предел на тело запроса; согласован с client_max_body_size в nginx
max_content_length_mb = 25

# Предел на одну загружаемую фотографию повреждения
max_file_size_mb = 5

# Сколько фотографий принимается к одному акту
max_photos = 10

# Границы страницы списка
default_per_page = 20
max_per_page = 100

[timeouts]
# Все четыре значения задаются раздельно: один общий таймаут скрывает
# разницу между «не удалось подключиться» и «сервис думает слишком долго»
payment_connect_seconds = 3
payment_read_seconds = 10
payment_write_seconds = 5
payment_pool_seconds = 5

[resilience]
# Предохранитель на платёжном шлюзе
failure_threshold = 5
recovery_seconds = 30
half_open_calls = 1

[retention]
# Срок хранения ключей идемпотентности; это часть контракта API,
# и укорачивать его молча нельзя
idempotency_hours = 24

# Сколько дней хранятся резервные копии
backup_days = 14
