# CI Waybill (глава 16): SQL Server 2025 в сервис-контейнере → миграции → тесты .NET → tSQLt → smoke API → Query Store baseline → артефакты.
# Секреты: MSSQL_SA_PASSWORD генерируется на лету (стенд живёт минуты); реальные секреты (Ollama, Event Hubs) в CI не нужны —
# скрипты глав 11/14 пропускают внешние интеграции по настройкам ops.Setting.
# Учебный workflow для отдельного репозитория, корнем которого служит этот проект.
name: waybill-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: .

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  MSSQL_SA_PASSWORD: "Ci_${{ github.run_id }}_Waybill!"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_${{ github.run_id }}_Waybill!"
          MSSQL_PID: Developer
          MSSQL_COLLATION: Latin1_General_100_CI_AS_SC_UTF8
          MSSQL_AGENT_ENABLED: "true"
        ports: ["127.0.0.1:1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Waybill.slnx -c Release

      - name: Migrate (sql/** без 16-ops — бэкапы и задания применяются отдельным шагом)
        env:
          WAYBILL_CONNECTION: "Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=Mandatory;TrustServerCertificate=true"
        run: dotnet run --project src/Waybill.Migrator -c Release --no-build -- --sql ./sql --skip 16-ops

      - name: "Ops scripts (16-ops: recovery, backup chain, drift snapshot)"
        env:
          WAYBILL_CONNECTION: "Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=Mandatory;TrustServerCertificate=true"
        run: dotnet run --project src/Waybill.Migrator -c Release --no-build -- --sql ./sql --only 16-ops

      - name: Query Store baseline (before)
        shell: pwsh
        run: ./scripts/query.ps1 -Server "localhost,1433" -User sa -Password $env:MSSQL_SA_PASSWORD -Query "EXEC ops.usp_QueryStoreBaseline @Label = 'before', @Hours = 1;"

      - name: Integration tests (.NET, локальный режим против сервис-контейнера)
        env:
          WAYBILL_CONNECTION: "Server=localhost,1433;Database=Waybill;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=Mandatory;TrustServerCertificate=true"
          WAYBILL_TEST_MODE: local
        run: dotnet test tests/Waybill.Tests -c Release --no-build --logger "trx;LogFileName=dotnet-tests.trx" --results-directory artifacts/tests

      - name: tSQLt
        shell: pwsh
        run: |
          ./scripts/tsqlt.ps1 -Install -Server "localhost,1433" -User sa -Password $env:MSSQL_SA_PASSWORD
          ./scripts/tsqlt.ps1 -Server "localhost,1433" -User sa -Password $env:MSSQL_SA_PASSWORD

      - name: Smoke API
        env:
          Waybill__ConnectionString: "Server=localhost,1433;Database=Waybill;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=Mandatory;TrustServerCertificate=true"
          Urls: http://localhost:5080
        run: |
          dotnet run --project src/Waybill.Api -c Release --no-build &
          for i in $(seq 1 30); do curl -fs http://localhost:5080/health && break; sleep 2; done
          curl -fs http://localhost:5080/health
          curl -fs -X POST http://localhost:5080/webhooks/fastex -H "Content-Type: application/json" --data @data/webhooks/fastex.json
          curl -fs http://localhost:5080/shipments/FX0000000001/timeline -o /dev/null -w "timeline %{http_code}\n"
          curl -fs "http://localhost:5080/merchants/1/shipments/sorted?sort=CreatedAt&dir=DESC&pageSize=5" -o /dev/null -w "sorted %{http_code}\n"
          kill %1 || true

      - name: Query Store compare (after) → артефакт регрессий
        shell: pwsh
        run: |
          ./scripts/query.ps1 -Server "localhost,1433" -User sa -Password $env:MSSQL_SA_PASSWORD -Query "EXEC ops.usp_QueryStoreBaseline @Label = 'after', @Hours = 1;"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ./scripts/query.ps1 -Server "localhost,1433" -User sa -Password $env:MSSQL_SA_PASSWORD -Query "SELECT * FROM ops.tvf_QueryStoreCompare('before', 'after', 2.0);" | Tee-Object artifacts/qs-regressions.txt

      - name: Drift check (schema vs deploy snapshot)
        shell: pwsh
        run: ./scripts/drift-check.ps1 -Server "localhost,1433" -User sa -Password $env:MSSQL_SA_PASSWORD

      - name: Backup artefact (ZSTD, для проверки восстановления в другом job)
        shell: pwsh
        run: |
          ./scripts/query.ps1 -Server "localhost,1433" -User sa -Password $env:MSSQL_SA_PASSWORD -Query "EXEC ops.usp_BackupDatabase @Type = 'FULL', @CopyOnly = 1; SELECT TOP (1) Target FROM ops.vw_BackupHistory ORDER BY StartedAt DESC;"
          docker cp $(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2025-latest):/var/opt/mssql/data/. artifacts/backup/ 2>$null || echo "backup copy skipped"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waybill-ci-${{ github.run_number }}
          path: |
            artifacts/**
            tests/tsqlt/results.xml
          retention-days: 14
