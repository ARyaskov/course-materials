# Стенд Waybill на SQL Server 2025 в контейнере (альтернатива локальному экземпляру).
#   docker compose up -d                          # только база
#   ./scripts/apply.ps1 -Server "localhost,1433" -User sa -Password $env:MSSQL_SA_PASSWORD
#   docker compose --profile app up -d --build    # база + миграции + API (глава 16)
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: waybill-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Waybill_Dev_2025!}
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"        # SQL Agent нужен главам 11 (CDC), 13 (jobs), 16 (бэкапы)
      MSSQL_COLLATION: Latin1_General_100_CI_AS_SC_UTF8
      MSSQL_BACKUP_DIR: /var/opt/mssql/backup
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - waybill-data:/var/opt/mssql
      - waybill-backup:/var/opt/mssql/backup   # бэкапы главы 16 — отдельный том, чтобы пережить пересоздание данных
      - ./data:/import:ro                      # CSV/JSON для BULK INSERT (глава 10)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Миграции: одноразовый контейнер с Migrator; API стартует только после его успешного завершения
  migrator:
    profiles: ["app"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: waybill-migrator
    working_dir: /work
    volumes:
      - ./:/work:ro
      - migrator-nuget:/root/.nuget/packages
    environment:
      WAYBILL_CONNECTION: "Server=mssql,1433;User ID=sa;Password=${MSSQL_SA_PASSWORD:-Waybill_Dev_2025!};Encrypt=Mandatory;TrustServerCertificate=true"
      DOTNET_CLI_HOME: /tmp
    command: ["dotnet", "run", "--project", "src/Waybill.Migrator", "--", "--sql", "./sql", "--skip", "16-ops"]
    depends_on:
      mssql:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Waybill.Api/Dockerfile
    container_name: waybill-api
    environment:
      Waybill__ConnectionString: "Server=mssql,1433;Database=Waybill;User ID=sa;Password=${MSSQL_SA_PASSWORD:-Waybill_Dev_2025!};Encrypt=Mandatory;TrustServerCertificate=true"
      Ai__Enabled: "false"
      Outbox__Workers: "2"
    ports:
      - "127.0.0.1:5080:5080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5080' || exit 1"]   # в образе aspnet нет curl/wget: проверяем порт
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  waybill-data:
  waybill-backup:
  migrator-nuget:
