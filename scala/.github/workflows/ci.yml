name: Scala checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - run: sbt --batch scalafmtCheckAll scalafmtSbtCheck test
