# cargo-deny policy: security advisories, licence allow-list, duplicate and
# banned crates. Run with `cargo deny check`.
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
# Each ignore is a conscious decision with an owner and a reason, not a way to
# silence the tool. Revisit on every dependency bump.
ignore = [
    # `paste` is unmaintained but a tiny, finished proc-macro pulled in by
    # utoipa-axum; it runs at compile time only.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro, transitive via utoipa-axum, compile-time only" },
    # RSA timing side channel (Marvin). CourseFlow signs JWTs with HS256 and
    # never handles RSA keys; the crate is only compiled as part of jsonwebtoken's backend.
    { id = "RUSTSEC-2023-0071", reason = "rsa: only reachable through RSA algorithms which CourseFlow does not use" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "OpenSSL", "Unlicense", "0BSD"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace members reference each other by path without a version: that is fine
allow-wildcard-paths = true
deny = [
    # native TLS drags OpenSSL into the image; the workspace standardizes on rustls
    { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
