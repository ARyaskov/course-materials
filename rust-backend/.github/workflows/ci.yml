name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  test:
    name: tests (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: courseflow
          POSTGRES_PASSWORD: courseflow
          POSTGRES_DB: courseflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U courseflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://courseflow:courseflow@localhost:5432/courseflow
      COURSEFLOW_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # sqlx-cli must be built with `sqlx-toml`, or it refuses to run in a
      # workspace that has sqlx.toml; prebuilt binaries do not enable it.
      - name: install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls,sqlx-toml
      - name: migrations + offline metadata are in sync
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --workspace --check
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker compose config is valid
        run: docker compose --profile full --profile otel config --quiet
      - name: build images
        run: docker compose --profile full build
      - name: smoke test
        run: ./scripts/smoke.sh
      - name: logs on failure
        if: failure()
        run: docker compose --profile full logs --no-color | tail -200
