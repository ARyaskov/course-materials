[package]
name = "courseflow-api"
description = "CourseFlow HTTP API: REST, WebSocket, SSE, OpenAPI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "courseflow-api"
path = "src/main.rs"

[dependencies]
courseflow-core = { workspace = true, features = ["openapi"] }
courseflow-app.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
secrecy.workspace = true
tracing.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
bytes = "1"

[dev-dependencies]
insta.workspace = true
wiremock.workspace = true
http-body-util = "0.1"

[features]
# Forwarded to courseflow-app: OTLP trace export.
otel = ["courseflow-app/otel"]

[lints]
workspace = true
